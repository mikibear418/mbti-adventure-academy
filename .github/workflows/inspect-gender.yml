name: Inspect MBTI layout (temporary)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Log stripped HTML structure for gender-card integration
        run: |
          node <<'NODE'
          const fs = require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const stripped=s.replace(new RegExp('data:image[^,]+,[A-Za-z0-9+/=]+','gi'),'[EMBEDDED IMAGE]');
          console.log('SOURCE_SIZE',s.length,'STRIPPED_SIZE',stripped.length);
          console.log('=== TOP HTML ===');
          console.log(stripped.slice(0,8500));
          console.log('=== END OF HTML (LAST 35000) ===');
          console.log(stripped.slice(-35000));
          NODE

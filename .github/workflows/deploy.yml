name: Publish MBTI Adventure Academy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v6
      - name: Expand ImageGen role-card upload
        shell: bash
        run: |
          set -euo pipefail
          test -s MBTI_32_ImageGen_Character_Cards_GitHub_Ready.zip
          unzip -q -o "MBTI_32_ImageGen_Character_Cards_GitHub_Ready.zip" 'assets/characters/*' 'assets/portraits/*' 'assets/gender-cards.js' 'tests/verify-imagegen.cjs'
          test -s assets/characters/INTJ-male.webp
          test -s assets/characters/INTJ-female.webp
          test -s assets/characters/ENFP-male.webp
          test -s assets/characters/ENFP-female.webp
      - name: Attach gender-specific character artwork to the published page
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/gender-cards.js
          node <<'NODE'
          const fs=require('node:fs');
          const p='index.html', html=fs.readFileSync(p,'utf8');
          const snippet='<link rel="stylesheet" href="./assets/gender-cards.css">\n<script defer src="./assets/gender-cards.js"></script>\n';
          if(!html.includes('</body>'))throw Error('Cannot find HTML closing body tag');
          if(html.includes('gender-cards.js'))throw Error('Role-card script was already injected into source');
          fs.writeFileSync(p,html.replace('</body>',snippet+'</body>'));
          console.log('Gender-card add-on inserted while retaining the 80 original questions.');
          NODE
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published website is reachable
        shell: bash
        run: |
          set -euo pipefail
          base="https://mikibear418.github.io/mbti-adventure-academy"
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 4 --max-time 20 "$base/" -o /tmp/mbti-home.html
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 4 --max-time 20 "$base/poster.html" -o /tmp/mbti-poster.html
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 4 --max-time 20 "$base/assets/classroom-qr.png" -o /tmp/mbti-classroom-qr.png
          grep -q 'const QUESTIONS=' /tmp/mbti-home.html
          grep -q 'classroom-qr.png' /tmp/mbti-poster.html
          test "$(wc -c </tmp/mbti-classroom-qr.png)" -gt 1000
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 4 --max-time 20 "$base/assets/gender-cards.js" -o /tmp/mbti-gender.js
          curl -fLsS --retry 8 --retry-all-errors --retry-delay 4 --max-time 20 "$base/assets/gender-cards.css" -o /tmp/mbti-gender.css
          grep -q 'gender-cards.js' /tmp/mbti-home.html
          grep -q 'makePortrait' /tmp/mbti-gender.js
          grep -q 'gender-picker' /tmp/mbti-gender.css
          node --check /tmp/mbti-gender.js
          echo "PASS: Live 80-question website, 32 gender role-card variants, poster and QR assets are accessible."
